<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>egui-charts | Live Demo</title>
    <script>
        // Only this key distinguishes a choice from palettes saved by earlier releases.
        try {
            const theme = localStorage.getItem('theme_choice');
            if (theme === 'true' || theme === 'false') {
                document.documentElement.dataset.theme = theme === 'true' ? 'dark' : 'light';
            }
        } catch (_) {
            // Unreadable storage follows the system appearance.
        }
    </script>
    <style>
        :root { color-scheme: light; --bg: #fff; --text: #666; --border: #ebebeb; }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; --bg: #000; --text: #a6a6a6; --border: #2a2a2a; }
        }
        :root[data-theme="light"] { color-scheme: light; --bg: #fff; --text: #666; --border: #ebebeb; }
        :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --text: #a6a6a6; --border: #2a2a2a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
        canvas { width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            z-index: 10;
        }
        #loading .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: #2962ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        Loading egui-charts demo&hellip;
    </div>
    <canvas id="demo_canvas"></canvas>
    <link data-trunk rel="icon" href="../../docs/site/public/favicon.svg" />
    <!-- Same-origin static page: integrity on the module preload adds nothing and makes browsers warn. -->
    <link data-trunk rel="rust" data-cargo-profile-release="wasm-release" data-wasm-opt="z" data-integrity="none" />
    <!-- The module embeds egui's default fonts and Lucide icons; their licences are published next to this page. -->
    <link data-trunk rel="copy-file" href="LICENSE-fonts.txt" />
    <link data-trunk rel="copy-file" href="../../assets/icons/LICENSE-lucide.txt" />
    <script>
        // The module removes this overlay once its first frame has been painted, so the canvas is
        // never shown blank. This message only appears when the module never got that far.
        setTimeout(() => {
            const overlay = document.getElementById('loading');
            if (overlay) {
                overlay.textContent = 'The chart could not start. Please reload the page.';
            }
        }, 20000);
    </script>
</body>
</html>
