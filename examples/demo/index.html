<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracly | Live Chart</title>
    <script>
        // Only this key distinguishes a choice from palettes saved by earlier releases.
        try {
            const theme = localStorage.getItem('theme_choice');
            if (theme === 'true' || theme === 'false') {
                document.documentElement.dataset.theme = theme === 'true' ? 'dark' : 'light';
            }
        } catch (_) {
            // Unreadable storage follows the system appearance.
        }
    </script>
    <style>
        :root { color-scheme: light; --bg: #fff; --text: #464a4d; --border: #e4e6e9; }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; --bg: #000; --text: #a1a4a5; --border: #292d30; }
        }
        :root[data-theme="light"] { color-scheme: light; --bg: #fff; --text: #464a4d; --border: #e4e6e9; }
        :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --text: #a1a4a5; --border: #292d30; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
        canvas { width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            z-index: 10;
        }
        #loading .brand-dark { display: none; width: 136px; height: auto; }
        #loading .brand-light { display: block; width: 136px; height: auto; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) #loading .brand-dark { display: block; }
            :root:not([data-theme="light"]) #loading .brand-light { display: none; }
        }
        :root[data-theme="dark"] #loading .brand-dark { display: block; }
        :root[data-theme="dark"] #loading .brand-light { display: none; }
        #loading .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: #ffb500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <img class="brand-dark" src="oracly-dark-stacked-320w.png" alt="Oracly" />
        <img class="brand-light" src="oracly-light-stacked-320w.png" alt="Oracly" />
        <div class="spinner"></div>
    </div>
    <canvas id="demo_canvas"></canvas>
    <link data-trunk rel="icon" href="../../assets/branding/oracly-dark-favicon-multi.ico" />
    <link data-trunk rel="copy-file" href="../../assets/branding/oracly-dark-stacked-320w.png" />
    <link data-trunk rel="copy-file" href="../../assets/branding/oracly-light-stacked-320w.png" />
    <!-- Same-origin static page: integrity on the module preload adds nothing and makes browsers warn. -->
    <link data-trunk rel="rust" data-cargo-profile-release="wasm-release" data-wasm-opt="z" data-integrity="none" />
    <!-- The module embeds egui's default fonts and Oracly icons; their licences are published next to this page. -->
    <link data-trunk rel="copy-file" href="LICENSE-fonts.txt" />
    <link data-trunk rel="copy-file" href="../../assets/icons/LICENSE-lucide.txt" />
    <script>
        // The module removes this overlay once its first frame has been painted, so the canvas is
        // never shown blank. Show an error message only if initialization actually fails.
        const showBootError = () => {
            const overlay = document.getElementById('loading');
            if (overlay) {
                overlay.textContent = 'The chart could not start. Please reload the page.';
            }
        };
        window.addEventListener('TrunkApplicationStarted', () => {}, { once: true });
        window.addEventListener('unhandledrejection', showBootError, { once: true });
    </script>
</body>
</html>
