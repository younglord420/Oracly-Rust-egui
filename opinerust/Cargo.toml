[package]
name = "opinerust"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "OpineRust: Pine Script (R) v5/v6 runtime bridge and studio editor dock for Oracly charts"
repository = "https://github.com/younglord420/Oracly-Rust-egui.git"
homepage = "https://oracl.io"
keywords = ["trading", "pinescript", "charts", "egui", "finance"]
categories = ["visualization", "gui", "finance"]
readme = "README.md"

[features]
default = ["studio"]
# The code editor canvas and the OpineRust dock. Off by default only for a host
# that wants the engine alone (a server, a CLI, a headless test).
studio = []

[dependencies]
# Oracly's study contract and models. `studies` keeps built-ins out of the bridge;
# `ui` and `ui_kit` are what the studio dock is drawn with.
Oracly-charts = { package = "Oracly-charts", path = "..", default-features = false, features = [
    "widget",
    "studies",
    "icons",
    "ui",
] }
# The OpineRust runtime, our fork of Pinecone. Reported to users as the OpineRust
# engine; named as Pinecone in attribution and licensing because that is the
# dependency's origin. Its umbrella crate pulls `pine-data` -> `ureq`/`ring`, which
# cannot build for `wasm32-unknown-unknown`, so the bridge uses the core crates
# directly.
#
# Pinned to one revision, never to `main`: every crate below must come from the
# same commit or Cargo links two copies of the same types. The repository is
# private, so a clean build needs credentials; `net.git-fetch-with-cli = true`
# makes Cargo reuse the git CLI's ssh-agent/SSH config instead of its own.
pine-core = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-lexer = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-parser = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-interpreter = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-builtins = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-sema = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
pine-diagnostics = { git = "ssh://git@github.com/younglord420/OpineRust.git", rev = "25f9e41ce8de6f8167ef9c1b0c661a46f274d71f" }
# `Color32` is the chart's colour type; Oracly uses it for plot colours.
egui = { version = "0.37.0", default-features = false }
# Bar timestamps in tests and the host adapter.
chrono = { version = "0.4.43", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

# The tests draw real frames and read the painted gutter, which needs glyph
# metrics: without fonts every width is zero and the line numbers land off-screen.
[dev-dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }

[workspace]

[lib]
name = "opinerust"
path = "src/lib.rs"
