[package]
name = "egui-charts-terminal"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Standalone like `examples/demo`: built on its own, never by the library crate.
[workspace]

[dependencies]
egui-charts = { package = "Oracly-charts", path = "..", features = ["ui"] }
# The study editor dock lives in the OpineRust add-on, not in the chart crate.
opinerust = { path = "../opinerust" }
egui = "0.37.0"
chrono = "0.4.43"
egui_extras = { version = "0.37.0", default-features = false }
png = "0.17.16"
serde_json = "1.0.149"

[dev-dependencies]
# `examples/terminal.rs` is a standalone `eframe` app over the library's synthetic feed; the
# windowing features match the library's examples.
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "x11", "wayland"] }
rand = "0.10.0"
